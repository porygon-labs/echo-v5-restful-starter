services:
  adminer:
    image: arm64v8/adminer:5.4.2-standalone
    restart: unless-stopped
    ports:
      - 9090:8080
  redis:
    image: arm64v8/redis:8.8-alpine3.23
    restart: unless-stopped
    ports:
      - 6379:6379
    volumes:
      - redis_data:/data
  postgres:
    image: arm64v8/postgres:18-alpine3.24
    restart: unless-stopped
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql
  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.20.0
    restart: unless-stopped
    ports:
      - 16686:16686
      - 4317:4317
      - 4318:4318
      - 5778:5778
      - 9411:9411

volumes:
  redis_data:
  postgres_data:
